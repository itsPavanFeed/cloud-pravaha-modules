# Kind SecurityGroup: contracts use `kind: SecurityGroup`.
# Inputs list what a contract may set (with kind defaults); enforced is the locked security baseline.
kind: SecurityGroup
id: aws-security-group
title: AWS security group
description: Security group with explicit ingress and egress rules. Policy blocks 0.0.0.0/0 ingress.
source: terraform-aws-modules/security-group/aws
versions:
  - 6.0.0
providers:
  - hashicorp/aws
inputs:
  - name: name
    type: string
    required: true
    description: Security group name.
    pattern: ^[a-z0-9-]{1,64}$
  - name: description
    type: string
    description: Security group description.
    pattern: ^[A-Za-z0-9 ._-]{0,200}$
  - name: vpc_id
    type: string
    required: true
    description: VPC ID, usually a reference to an aws-vpc module output.
    pattern: ^vpc-[0-9a-f]{8,17}$
  - name: ingress_rules
    type: json
    description: Map of ingress rules (cidr_ipv4, from_port, to_port, ip_protocol, description).
  - name: egress_rules
    type: json
    description: Map of egress rules.
  - name: tags
    type: map(string)
    description: Tags for the security group.
outputs:
  - id
  - arn
  - name
