# Kind CloudKMSKeyRing: contracts use `kind: CloudKMSKeyRing`.
# Inputs list what a contract may set (with kind defaults); enforced is the locked security baseline.
kind: CloudKMSKeyRing
id: gcp-kms
title: GCP Cloud KMS keyring
description: Keyring and keys with 90-day rotation, protected from destroy.
source: terraform-google-modules/kms/google
versions:
  - 4.2.1
providers:
  - hashicorp/google
inputs:
  - name: project_id
    type: string
    required: true
    description: GCP project ID.
    pattern: ^[a-z][a-z0-9-]{4,28}[a-z0-9]$
  - name: location
    type: string
    required: true
    description: Location, e.g. us-central1 or global.
    pattern: ^[a-z0-9-]{2,30}$
  - name: keyring
    type: string
    required: true
    description: Keyring name.
    pattern: ^[a-zA-Z0-9_-]{1,63}$
  - name: keys
    type: list(string)
    required: true
    description: Key names.
    item_pattern: ^[a-zA-Z0-9_-]{1,63}$
    max_items: 20
  - name: key_protection_level
    type: string
    description: Protection level.
    default: SOFTWARE
    allowed:
      - SOFTWARE
      - HSM
  - name: labels
    type: map(string)
    description: Labels.
enforced:
  key_rotation_period: 7776000s
  prevent_destroy: true
outputs:
  - keyring
  - keys
