# Kind GCPNetwork: contracts use `kind: GCPNetwork`.
# Inputs list what a contract may set (with kind defaults); enforced is the locked security baseline.
kind: GCPNetwork
id: gcp-network
title: GCP VPC network
description: Custom-mode VPC with subnets. Auto-created subnets are disabled and default internet routes are removed.
source: terraform-google-modules/network/google
versions:
  - 18.3.1
providers:
  - hashicorp/google
  - hashicorp/google-beta
inputs:
  - name: project_id
    type: string
    required: true
    description: GCP project ID.
    pattern: ^[a-z][a-z0-9-]{4,28}[a-z0-9]$
  - name: network_name
    type: string
    required: true
    description: Network name.
    pattern: ^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$
  - name: subnets
    type: json
    required: true
    description: List of subnets (subnet_name, subnet_ip, subnet_region, subnet_private_access, subnet_flow_logs).
  - name: routing_mode
    type: string
    description: Routing mode.
    default: GLOBAL
    allowed:
      - GLOBAL
      - REGIONAL
  - name: description
    type: string
    description: Network description.
    pattern: ^[A-Za-z0-9 ._-]{0,200}$
enforced:
  auto_create_subnetworks: false
  delete_default_internet_gateway_routes: true
outputs:
  - network_name
  - network_self_link
  - subnets_names
  - subnets_self_links
