# Kind GCSBuckets: contracts use `kind: GCSBuckets`.
# Inputs list what a contract may set (with kind defaults); enforced is the locked security baseline.
kind: GCSBuckets
id: gcp-cloud-storage
title: GCP Cloud Storage buckets
description: One or more buckets with uniform access and public access prevention enforced.
source: terraform-google-modules/cloud-storage/google
versions:
  - 12.4.1
providers:
  - hashicorp/google
  - hashicorp/random
inputs:
  - name: project_id
    type: string
    required: true
    description: GCP project ID.
    pattern: ^[a-z][a-z0-9-]{4,28}[a-z0-9]$
  - name: names
    type: list(string)
    required: true
    description: Bucket name suffixes.
    item_pattern: ^[a-z0-9-]{1,40}$
    max_items: 10
  - name: prefix
    type: string
    description: Prefix for every bucket name.
    pattern: ^[a-z0-9-]{0,20}$
  - name: location
    type: string
    required: true
    description: Bucket location, for example EU or europe-west1.
    pattern: ^[A-Za-z0-9-]{2,30}$
  - name: storage_class
    type: string
    description: Storage class.
    default: STANDARD
    allowed:
      - STANDARD
      - NEARLINE
      - COLDLINE
      - ARCHIVE
  - name: versioning
    type: map(bool)
    description: Versioning per bucket name.
  - name: force_destroy
    type: map(bool)
    description: Allow destroying non-empty buckets, per bucket name.
  - name: labels
    type: map(string)
    description: Labels for every bucket.
enforced:
  bucket_policy_only: {}
  public_access_prevention: enforced
outputs:
  - names
  - urls
  - names_list
